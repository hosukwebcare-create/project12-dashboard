# 로컬 서버(온프레미스) 배포 구성: app + postgres + caddy(HTTPS)
#   cp deploy/.env.production.example deploy/.env.production   # 값 채우기
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: byeolha
      POSTGRES_USER: byeolha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byeolha -d byeolha"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      target: migrate
    environment:
      DATABASE_URL: postgres://byeolha:${POSTGRES_PASSWORD}@postgres:5432/byeolha
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ..
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://byeolha:${POSTGRES_PASSWORD}@postgres:5432/byeolha
      SESSION_SECRET: ${SESSION_SECRET}
      JOB_SECRET: ${JOB_SECRET}
      STORAGE_DRIVER: local
      STORAGE_DIR: /app/storage
      ALIMTALK_PROVIDER: ${ALIMTALK_PROVIDER:-mock}
      ALIMTALK_ENDPOINT: ${ALIMTALK_ENDPOINT:-}
      ALIMTALK_API_KEY: ${ALIMTALK_API_KEY:-}
      ALIMTALK_SENDER_KEY: ${ALIMTALK_SENDER_KEY:-}
      HERO_WEBHOOK_SECRET: ${HERO_WEBHOOK_SECRET:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # 배치: 알림톡 5분 · 웹훅 1분 · 보관기간 매일 03:00
  scheduler:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      JOB_SECRET: ${JOB_SECRET}
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
      echo '*/5 * * * * curl -s -X POST -H \"x-job-secret: $$JOB_SECRET\" http://app:3000/api/jobs/alimtalk' > /etc/crontabs/root &&
      echo '* * * * * curl -s -X POST -H \"x-job-secret: $$JOB_SECRET\" http://app:3000/api/jobs/outbox' >> /etc/crontabs/root &&
      echo '0 3 * * * curl -s -X POST -H \"x-job-secret: $$JOB_SECRET\" http://app:3000/api/jobs/retention' >> /etc/crontabs/root &&
      echo '30 3 * * * pg_dump_placeholder' >/dev/null &&
      crond -f -l 2"
    depends_on:
      - app

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
