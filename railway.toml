# Railway 배포 설정. 루트 Dockerfile(runner 타깃)로 빌드하고 /api/health 로 상태를 확인한다.
# 마이그레이션은 배포 전 커맨드로 실행한다 (drizzle-kit migrate 는 migrate 타깃과 같은 의존성을 쓴다).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
